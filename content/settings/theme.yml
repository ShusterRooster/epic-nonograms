theme:
  - borderColor: "#252e1f"
    name: "Border color"
    info: "Color of the tile borders"
  - borderThickness: "1px"
    name: "Border thickness"
    info: "Thickness of the tile borders"

  - markerLine: "#2f3624"
    name: "Marker line color"
    info: "Color of the marker line (the one that appears every 5 tiles)"
  - markerThickness: "3px"
    name: "Marker line thickness"
    info: "Thickness of the marker line"
  - markerNumberMargin: "0.25rem"
    name: "Marker number margin"
    info: "The left margin of the marker numbers"
  - markerNumberColor: "wheat"
    name: "Marker number color"
    info: "Color of the marker numbers"

  - fulfilledNumberColor: "#4e4e4e"
    name: "Fulfilled number color"
    info: "Color of the number that indicates when a hint number has been filled"

  - headBG: "#0f1e0f"
    name: "Head tile background color"
    info: "Color of the background of the head of the rows and columns"
  - headText: "#a9c3a8"
    name: "Head tile number color"
    info: "Color of the numbers within the head of the rows and columns"

  - tileColor: "#0a130a"
    name: "Tile color"
    info: "Inner color of the tiles"
  - tileHover: "#4c534c"
    name: "Tile hover color"
    info: "The color of the tiles upon hovering with a selector"
  - tileHoverHighlight: "#304330"
    name: "Tile hover highlight color"
    info: "The color of the tiles in the same row and column as the tile that is being hovered"

  - dragFillColor: "#175117"
    name: "Drag fill color"
    info: "The color of the tiles when dragged in FILL mode"
  - dragCrossColor: "darkred"
    name: "Drag cross color"
    info: "The color of the tiles when dragged in CROSS mode"

  - tileFillColor: "wheat"
    name: "Tile filled color"
    info: "The filled color of the tiles"

  - selectorColor: "#858508"
    name: "Selector highlight color"
    info: "The color of the tiles in the same row and column as the selector"
  - selectorOutline: "yellow"
    name: "Selector outline color"
    info: "The outline color of the selector"

  - floatColor: "#650040"
    name: "Float background color"
    info: "The background color of the floating number counter"

  - guiColor: "darkslategray"
    name: "User interface color"
    info: "The background color of the user interface"

  - buttonColor: "#809da5"
    name: "Standard button color"
    info: "The color of a button when not activated"

  - buttonActive: "#abeeff"
    name: "Active button color"
    info: "The color of a button when active"

  - buttonHover: "#c5d1e4"
    name: "Hover button color"
    info: "The color of a button when hovered with mouse"

  - buttonShadow: "darkslategray"
    name: "Button shadow color"
    info: "The color of the shadow of the button"